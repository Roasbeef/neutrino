name: Staged compact filters

on:
  push:
    branches:
      - roasbeef/staged-compact-filters
  pull_request:
    branches:
      - roasbeef/block-matcher

permissions:
  contents: read

concurrency:
  group: staged-compact-filters-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.26.10"

jobs:
  dependency-metadata:
    if: github.repository == 'Roasbeef/neutrino'
    name: Resolve and record Go module checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Resolve the pinned wire module
        run: |
          go mod tidy
          go mod download -json github.com/btcsuite/btcd/wire/v2
          git diff -- go.mod go.sum
      - uses: actions/upload-artifact@v4
        with:
          name: staged-go-module-metadata
          path: |
            go.mod
            go.sum
          if-no-files-found: error

  staged-filters:
    if: github.repository == 'Roasbeef/neutrino'
    name: Staged filters (${{ matrix.mode }})
    needs: dependency-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            experiment: ""
            tags: ""
          - mode: simd
            experiment: simd
            tags: ""
          - mode: purego
            experiment: simd
            tags: purego
    env:
      GOEXPERIMENT: ${{ matrix.experiment }}
      TEST_TAGS: ${{ matrix.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staged-go-module-metadata
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test filter decoding and script mapping
        run: go test -mod=readonly -tags="$TEST_TAGS" -count=1 ./internal/stagedfilters ./internal/filterhash
      - name: Test the peer and wallet matcher
        if: matrix.mode == 'default'
        run: go test -mod=readonly -count=1 -run '^(TestStagedFiltersOnBitcoinPeer|TestRescanWithMatcher|TestUtxoMatcherRejectsCandidate)$' .
      - name: Report formatting differences
        if: matrix.mode == 'default'
        run: gofmt -d neutrino.go query.go rescan.go staged_filters.go staged_filters_test.go internal/stagedfilters/*.go internal/filterhash/*.go
      - name: Vet the staged packages
        if: matrix.mode == 'default'
        run: go vet -mod=readonly ./internal/stagedfilters ./internal/filterhash

  full-suite:
    if: github.repository == 'Roasbeef/neutrino'
    name: Full Go suite
    needs: dependency-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staged-go-module-metadata
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Install btcd for RPC integration tests
        run: |
          make btcd
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run the suite
        run: go test -mod=readonly -p 2 -timeout=25m ./...
